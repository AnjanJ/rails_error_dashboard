name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.7.0). Must match lib/rails_error_dashboard/version.rb on main. Used only to confirm intent."
        required: true
        type: string

# Nothing at the workflow level: each job below declares exactly what its token
# may do. Only `publish` can request the RubyGems trusted-publishing token
# (id-token: write), and it runs nothing but the gem's own build and push.
# spec/ci/workflows_spec.rb checks this shape on every PR.
permissions: {}

# Third-party actions are pinned to commit SHAs (version in the comment);
# Dependabot's github-actions updates keep them current.

jobs:
  # Automated path: release-please opens/updates the release PR on every push
  # to main, and creates the GitHub release + tag when that PR is merged.
  # It works through the API, so it needs no checkout.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Create releases and tags
      pull-requests: write # Create/update release PRs

    steps:
      - name: Create Release PR or Publish Release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

    outputs:
      # Consumed by the test job below (and through it, publish and
      # smoke-test), which cannot detect a release on their own.
      release_created: ${{ steps.release.outputs.release_created }}

  # Runs the whole suite and RuboCop on the released commit before anything is
  # published, with a read-only token. These gems are resolved fresh (there is
  # no committed lockfile), so this job deliberately holds no write or
  # publishing permission.
  #
  # Two triggers share this job and `publish`:
  #   - a push to main that created a release (release_created == 'true');
  #   - a manual dispatch (the escape hatch, see `publish`), on which `release`
  #     is skipped. A skipped `needs` would skip this job too, and everything
  #     after it, without !cancelled() in the condition.
  test:
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Dispatch only: the `version` input must match version.rb on main. A
      # guardrail to confirm intent and prevent accidental publishes of the
      # wrong version. The input reaches the script as an env var.
      - name: Verify input version matches version.rb
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          file_version=$(ruby -r ./lib/rails_error_dashboard/version.rb -e 'puts RailsErrorDashboard::VERSION')
          if [ "$file_version" != "$INPUT_VERSION" ]; then
            echo "::error::Input version '$INPUT_VERSION' does not match version.rb '$file_version'. Aborting."
            exit 1
          fi
          echo "Version match confirmed: $file_version"

      # No bundler-cache anywhere in this workflow: what runs here is installed
      # fresh from RubyGems, never restored from a cache other workflows write.
      - name: Set up Ruby
        uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: .ruby-version
          bundler-cache: false

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Run tests before publishing
        env:
          # Same as test.yml: Ferrum defaults to 10s waiting for Chrome's websocket
          # URL and a cold runner can exceed it. The 0.11.1 release run failed on
          # exactly this (Ferrum::ProcessTimeoutError) with nothing wrong in the gem.
          FERRUM_PROCESS_TIMEOUT: 30
        run: bundle exec rspec

      - name: Run RuboCop before publishing
        run: bundle exec rubocop

  # Publishes to RubyGems with Trusted Publishing: no API key, the job trades
  # its OIDC token (id-token: write) for a short-lived RubyGems credential.
  # See https://guides.rubygems.org/trusted-publishing/ -- the trusted
  # publisher on rubygems.org is keyed to this file name, release.yml.
  #
  # Also the manual escape hatch: dispatch this workflow with `version` set to
  # the version on main to republish WITHOUT going through release-please. Use
  # it when the automated run created the tag + GitHub release but a transient
  # failure (flaky test, network blip) blocked the publish, and re-running won't
  # help because release-please sees the release already exists.
  #
  # The `rubygems` environment accepts deployments from main only. The bundle
  # leaves out the development and test groups (see the Gemfile), so only the
  # gem's runtime dependencies are installed here.
  #
  # contents: write is needed: release-gem runs Bundler's `rake release`, which
  # creates and pushes the vX.Y.Z tag BEFORE it uploads the gem. release-gem
  # stores the job token in its own git credential cache for that push, so the
  # checkout persists none.
  publish:
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write
      id-token: write
    env:
      BUNDLE_WITHOUT: development:test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: .ruby-version
          bundler-cache: false

      - name: Install runtime dependencies only
        run: bundle install --jobs 4 --retry 3

      - name: Publish to RubyGems
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1

  # Smoke-test the live demo once a release has actually published.
  #
  # smoke-test-demo.yml declares `on: release: [published]` as well, and that
  # trigger has never once fired: release-please creates the release with the
  # default GITHUB_TOKEN, and GitHub does not raise workflow events for
  # anything that token creates (it is the standard guard against recursive
  # workflow runs). Calling the workflow from here is what makes the
  # post-release check actually run, without introducing a PAT whose only
  # purpose would be to defeat that guard.
  #
  # The demo deploys from its own repository on push, so this is a check that
  # the released gem works against the deployed site -- not a deploy gate.
  smoke-test:
    needs: publish
    if: ${{ !cancelled() && github.event_name == 'push' && needs.publish.result == 'success' }}
    # A called workflow can never hold MORE permissions than the job that
    # calls it. smoke-test-demo.yml's job asks for `issues: write` (it files an
    # issue when the smoke test fails); when this job granted less, GitHub
    # rejected the whole workflow at startup ("startup_failure"), and with it
    # release-please: no release PR could be opened from the moment this job
    # was added. Declaring the permissions in the callee is not enough; the
    # caller has to grant them here.
    permissions:
      contents: read
      issues: write
    # The `$/` form zizmor suggests is newer syntax; this path is what the
    # workflows spec checks.
    uses: ./.github/workflows/smoke-test-demo.yml # zizmor: ignore[self-repository]
    # Only the two secrets the smoke test reads, not `secrets: inherit`.
    secrets:
      DEMO_USER: ${{ secrets.DEMO_USER }}
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
