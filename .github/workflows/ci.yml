name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# No job here writes to the repository or calls the GitHub API, so every job
# gets a read-only token instead of the repository default.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUBY_VERSION: ruby-3.4.5
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.RUBY_VERSION }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.RUBY_VERSION }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      # Locale structure: key parity with en.yml, interpolation variables, and
      # plural categories. Runs in ~1s and needs no database. Warnings (unused
      # keys, glossary, stray English) do not fail the build.
      - name: Check locale files
        run: bin/i18n-check

  # Dependencies and workflows, a required check:
  # - bundle-audit, against an advisory database fetched in this run, on the
  #   bundle a fresh install of this branch resolves (Gemfile.lock is not
  #   committed). The default resolution only: the matrix rows pin older Rails
  #   versions, whose known advisories would fail every PR.
  # - actionlint, from its release tarball, checked against a pinned SHA-256.
  # - zizmor at low severity and up, from PyPI at a pinned version, run online
  #   so it also checks each pinned action against the tag in its comment.
  #   Without a token it silently skips its online audits.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.31.1
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ruby-3.4.5
          bundler-cache: true

      - name: Audit dependencies (bundle-audit)
        run: bundle exec bundle-audit check --update

      - name: Lint workflows (actionlint)
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint

      - name: Audit workflows (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec "zizmor==${ZIZMOR_VERSION}" zizmor --min-severity low .github/workflows/

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Integration Tests (shared + separate DB)

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # The CLI that runs `rails new`; the apps it builds resolve their own gems.
      - name: Install Rails CLI
        run: gem install rails --no-document # zizmor: ignore[adhoc-packages]

      - name: Run full integration tests
        run: bin/full-integration-test all


  # Verifies the upgrade instructions we give users actually work:
  # install the currently published gem, seed data under that schema, swap to
  # this branch, re-run the generator, migrate, and assert the new columns landed.
  #
  # Gated rather than run on every PR because it installs two gem versions and
  # boots a real Rails app (~3-5 min), and it depends on rubygems.org being
  # reachable. It runs when it can actually catch something:
  #   - release PRs (branch is always release-please--… ), the last gate before publish
  #   - any PR touching db/migrate/**, which is what breaks upgrades
  #
  # A job-level `if` cannot inspect changed files, so the `changes` job decides
  # and the upgrade job reads its answer. When there is nothing to check, the
  # upgrade check then shows as Skipped rather than as a pass that ran nothing.
  # `changes` is a required check: a skip caused by a failed `changes` job
  # would also count as passing, and let a release PR merge untested.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      upgrade: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Release PRs always run it; other PRs only when they touch migrations.
      #
      # The branch names reach the script as env vars rather than being
      # expanded into it, so a branch name is always data, never script text.
      - name: Decide whether to run
        id: decide
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if [[ "$HEAD_REF" == release-please--* ]]; then
            echo "run=true"  >> "$GITHUB_OUTPUT"
            echo "Release PR — verifying the upgrade path before publish."
          elif git diff --name-only "origin/$BASE_REF"...HEAD \
               | grep -qE '^db/migrate/'; then
            echo "run=true"  >> "$GITHUB_OUTPUT"
            echo "Migrations changed — verifying the upgrade path."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No migration changes and not a release PR — skipping."
          fi

  upgrade:
    needs: changes
    if: needs.changes.outputs.upgrade == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Upgrade Path (published → this branch)
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # The CLI that runs `rails new`; the apps it builds resolve their own gems.
      - name: Install Rails CLI
        run: gem install rails --no-document # zizmor: ignore[adhoc-packages]

      - name: Run upgrade path test
        run: bin/pre-release-test full_upgrade
