name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Read-only by default; each job asks for what it uses. Only the deploy job
# can write to Pages or mint an OIDC token.
permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site's settings
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install Jekyll dependencies
        # Installs the site's build tools; the site's own gems come from Gemfile.pages.
        run: | # zizmor: ignore[adhoc-packages]
          gem install jekyll bundler
          bundle config set --local path 'vendor/bundle'
          cat > Gemfile.pages <<EOF
          source 'https://rubygems.org'
          gem 'jekyll', '~> 4.3'
          gem 'jekyll-vitepress-theme', '~> 1.2'
          gem 'jekyll-seo-tag'
          gem 'jekyll-sitemap'
          EOF
          BUNDLE_GEMFILE=Gemfile.pages bundle install

      - name: Build with Jekyll
        run: |
          BUNDLE_GEMFILE=Gemfile.pages bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}" \
            --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
