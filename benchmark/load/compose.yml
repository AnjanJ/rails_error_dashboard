# The load test's stack (.shipkit/specs/deploy-shape-benchmark/, REQ-8): the app
# from ./Dockerfile, on Puma behind Thruster in production mode, and the
# PostgreSQL the generator set it up for. The app's settings are the generator's;
# its environment below holds only what a deploy has to supply.
#
#   docker compose -f benchmark/load/compose.yml up --build --wait
#   docker compose -f benchmark/load/compose.yml down --volumes
name: red-load

services:
  app:
    build:
      context: .
      additional_contexts:
        red: ../..
    environment:
      # The generated production database settings name the user and read this
      # password. libpq reads the host.
      PGHOST: db
      SHOP_DATABASE_PASSWORD: benchmark
      # Solid Queue's supervisor inside Puma, as the generator's deploy file runs it.
      SOLID_QUEUE_IN_PUMA: "true"
      # RED refuses to boot in production on its published default login.
      ERROR_DASHBOARD_USER: benchmark
      ERROR_DASHBOARD_PASSWORD: benchmark
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost/up" ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 120s

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: benchmark
    healthcheck:
      test: [ "CMD", "pg_isready", "--username", "shop" ]
      interval: 2s
      timeout: 5s
      retries: 30
