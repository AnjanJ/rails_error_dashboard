# The load test's stack (.shipkit/specs/deploy-shape-benchmark/, REQ-8): the app
# from ./Dockerfile, on Puma behind Thruster in production mode, and k6. The
# app's settings are the generator's; its environment holds only what a deploy
# has to supply, and RED's switch. A stack's database and queue are laid over
# this file from stacks/, one file for each (benchmark/load/stacks.rb, REQ-16),
# and APP_RUBY picks the Ruby, 3.4 unless 4.0 is asked for. The default stack:
#
#   docker compose -f benchmark/load/compose.yml -f benchmark/load/stacks/postgres.yml \
#     -f benchmark/load/stacks/solid-queue.yml up --build --wait
#   ... down --volumes
#
# A shape (benchmark/load/shapes.rb, REQ-16) holds the app to its CPUs, quota
# and memory, with no swap, and the database, Redis and k6 to the other CPUs.
# bin/benchmark-load --shape sets these variables; with none set, nothing is
# held to anything.
name: red-load

services:
  app:
    build:
      context: .
      additional_contexts:
        red: ../..
      args:
        RUBY_VERSION: "${APP_RUBY:-3.4}"
    environment:
      # RED refuses to boot in production on its published default login.
      ERROR_DASHBOARD_USER: benchmark
      ERROR_DASHBOARD_PASSWORD: benchmark
      # The load test's switch, which a deploy wouldn't have: "off" runs the
      # same app without RED. bin/benchmark-load sets it for each window.
      RED: "${RED:-on}"
    cpuset: "${APP_CPUSET:-}"
    cpus: "${APP_CPUS:-0}"
    mem_limit: "${APP_MEMORY:-0}"
    memswap_limit: "${APP_MEMORY:-0}"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost/up" ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 120s

  # The load generator, pinned by digest. It's in the `load` profile, so `up`
  # leaves it out and it runs only when asked:
  #
  #   docker compose -f benchmark/load/compose.yml run --rm \
  #     --env RATE=50 --env MIX=healthy k6 run /scripts/traffic.js
  k6:
    image: grafana/k6:1.8.2@sha256:00fdcebafbc86cb0137d429529b1caa401a02e09025f02fc74866fa6e2b004d8
    profiles: [ load ]
    cpuset: "${REST_CPUSET:-}"
    volumes:
      - ./traffic.js:/scripts/traffic.js:ro
